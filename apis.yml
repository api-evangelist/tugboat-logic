name: Tugboat Logic
x-type: company
description: Tugboat Logic is a security assurance and compliance automation platform acquired by OneTrust
  in 2021. It supports SOC 2, ISO 27001, HIPAA, GDPR, and NIST. As of 2024, the product has been rebranded
  under OneTrust's Certification Automation offering; legacy Tugboat Logic APIs are not publicly documented
  and integrations now flow through OneTrust's developer platform.
